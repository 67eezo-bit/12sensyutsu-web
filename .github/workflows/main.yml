name: Deploy to Sakura

on:
  push:
    branches:
      - main

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SAKURA_FTP_SERVER }}
          username: ${{ secrets.SAKURA_FTP_USERNAME }}
          password: ${{ secrets.SAKURA_FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/kei-on/www/12sensyutsu.com/
