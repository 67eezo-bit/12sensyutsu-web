name: Deploy to Sakura Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.5.0

        with:
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          server: www677.sakura.ne.jp
          port: 22
          sftp_only: true

          local_path: './*'
          remote_path: '/home/kei-on/www/12sensyutsu.com/'

          exclude: |
            .git*
            .github*
            README.md
