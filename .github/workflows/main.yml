name: Deploy to Sakura Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Pass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via SFTP (rsync)
        run: |
          sshpass -p "${{ secrets.SFTP_PASSWORD }}" rsync -avz -e "ssh -p 22 -o StrictHostKeyChecking=no" --exclude='.git*' --exclude='.github*' ./ ${{ secrets.SFTP_USERNAME }}@www677.sakura.ne.jp:/home/kei-on/www/12sensyutsu.com/