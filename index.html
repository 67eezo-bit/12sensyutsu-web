<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>12占術</title>
<style>
:root{--main:#1a1612;--bg:#fffaf0;--warm:#f7f0e4;--red:#b23a2e;--gold:#c9a24a}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Hiragino Mincho ProN','Yu Mincho',serif;background:var(--bg);color:var(--main);line-height:1.9}
.container{max-width:900px;margin:0 auto;padding:20px}
.card{background:rgba(255,255,255,.65);border:1px solid rgba(0,0,0,.08);border-radius:12px;padding:22px;margin:18px 0;box-shadow:0 12px 30px rgba(0,0,0,.05)}
h1{text-align:center;font-size:34px;letter-spacing:.15em;margin:30px 0 10px;color:var(--red)}
h2{text-align:center;font-size:24px;color:var(--red);margin:10px 0 20px}
.small{text-align:center;font-size:12px;letter-spacing:.25em;color:var(--red)}
.lead{text-align:center;font-size:14px;color:rgba(0,0,0,.65);margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label span{display:block;font-size:12px;color:var(--red);letter-spacing:.15em;margin-bottom:4px}
input,select{width:100%;padding:10px;border:none;border-bottom:1px solid rgba(0,0,0,.25);background:transparent;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:none}
.btn{display:block;margin:24px auto 0;background:var(--red);color:#fffaf0;padding:12px 32px;border-radius:6px;letter-spacing:.25em}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.tab{padding:9px 14px;border:1px solid rgba(0,0,0,.18);background:transparent;border-radius:6px}.tab.active{background:var(--red);color:#fffaf0;border-color:var(--red)}
.seasons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:24px 0}.season{text-align:center;border:1px solid rgba(201,162,74,.5);padding:12px;border-radius:8px;background:rgba(255,255,255,.45);font-size:13px}.season b{display:block;color:var(--red)}
.score-wrap{display:flex;justify-content:center;gap:16px;flex-wrap:wrap}.score{min-width:190px;text-align:center;border:1px solid rgba(201,162,74,.55);border-radius:10px;background:#fff;padding:18px}.score-title{font-size:12px;letter-spacing:.2em;color:rgba(0,0,0,.55)}.score-num{font-size:38px;color:var(--red);font-weight:bold}.comment{font-size:14px;margin-top:8px}.text p{margin:12px 0;font-size:15px}.quote{text-align:center;border-top:1px solid rgba(0,0,0,.12);margin-top:18px;padding-top:16px;color:rgba(0,0,0,.68);font-size:13px}
.footer{text-align:center;font-size:11px;color:rgba(0,0,0,.5);padding:30px 0}
@media(max-width:640px){.grid{grid-template-columns:1fr}.seasons{grid-template-columns:1fr 1fr}h1{font-size:26px}.container{padding:14px}}
</style>
</head>
<body>
<div class="container">
<p class="small">BIRTH → DESTINY → CYCLE</p>
<h1>12占術</h1>
<p class="lead">人生の現在地を知るためのライフサイクルガイド</p>
<div class="seasons">
<div class="season"><b>冬｜天命</b>静命・内観・再生</div>
<div class="season"><b>春｜始動</b>種火・発芽・上昇</div>
<div class="season"><b>夏｜飛翔</b>開花・躍動・栄光</div>
<div class="season"><b>秋｜黄金</b>収穫・豊穣・継承</div>
</div>
<div class="card">
<div class="grid">
<label><span>お名前</span><input id="name" placeholder="例：田中太郎"></label>
<label><span>生年月日</span><input id="birth" type="date"></label>
<label><span>お相手のお名前</span><input id="pname" placeholder="任意"></label>
<label><span>お相手の生年月日</span><input id="pbirth" type="date"></label>
<div style="grid-column:1/-1"><span style="font-size:12px;color:var(--red);letter-spacing:.15em">占う項目</span><div class="tabs">
<button class="tab active" data-key="恋愛">恋愛</button>
<button class="tab" data-key="結婚">結婚</button>
<button class="tab" data-key="仕事">仕事</button>
<button class="tab" data-key="金運">金運</button>
<button class="tab" data-key="相性">相性</button>
</div></div>
</div>
<button class="btn" onclick="run()">占う</button>
</div>
<div id="result"></div>
<div class="footer">12占術 Private Service</div>
</div>
<script>
const cycles=['静命','内観','再生','種火','発芽','上昇','開花','躍動','栄光','収穫','豊穣','継承'];
const season={静命:'冬｜天命',内観:'冬｜天命',再生:'冬｜天命',種火:'春｜始動',発芽:'春｜始動',上昇:'春｜始動',開花:'夏｜飛翔',躍動:'夏｜飛翔',栄光:'夏｜飛翔',収穫:'秋｜黄金',豊穣:'秋｜黄金',継承:'秋｜黄金'};
const summary={静命:'静かに心を見つめ直し、本当に必要なものへ戻る時期です。',内観:'不要なものを手放し、次の流れへ向けて心を軽くする時期です。',再生:'新しい自分が静かに立ち上がり始める時期です。',種火:'小さな希望や挑戦に火が灯り始める時期です。',発芽:'見えない場所で育っていたものが、少しずつ形になり始める時期です。',上昇:'止まっていた流れが動き、新しい景色が広がり始める時期です。',開花:'才能や魅力が自然と周囲へ伝わり始める時期です。',躍動:'出会いや評価が広がり、人生の流れが加速し始める時期です。',栄光:'積み重ねてきた経験が認められやすい時期です。',収穫:'過去の経験や行動が、現実的な形として戻ってくる時期です。',豊穣:'人生が豊かに満ち、心にも余白が生まれやすい時期です。',継承:'経験や想いを次へ繋いでいく時期です。'};
let selected='恋愛';let messages={};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');selected=b.dataset.key});
fetch('./data/12sensyutsu_messages.json').then(r=>r.json()).then(j=>messages=j).catch(()=>{});
function idx(date){const [y,m,d]=date.split('-').map(Number);return (y+m+d)%12}
function todayCycle(base){const n=new Date();return cycles[(base+n.getFullYear()+n.getMonth()+1+n.getDate())%12]}
function score(a,b){let x=Math.abs(cycles.indexOf(a)-cycles.indexOf(b));x=Math.min(x,12-x);return Math.max(42,98-x*7)}
function baseScore(a,b){let x=Math.abs(a-b);x=Math.min(x,12-x);return Math.max(42,98-x*6)}
function compatComment(s){if(s>=90)return '運命的な絆で結ばれた最高の相性です';if(s>=80)return '深い信頼で結ばれる素晴らしい相性です';if(s>=70)return '互いを高め合える良い相性です';if(s>=60)return '努力次第で素敵な関係を築けます';if(s>=50)return '理解し合うことで絆が深まります';return '違いを認め合うことが関係の鍵です'}
function msg(c,key){return messages?.[c]?.[key]}
function run(){const name=document.getElementById('name').value||'あなた';const birth=document.getElementById('birth').value;const pname=document.getElementById('pname').value||'お相手';const pbirth=document.getElementById('pbirth').value;if(!birth){alert('生年月日を入力してください');return}const bidx=idx(birth);const c=todayCycle(bidx);const m=msg(c,selected);let html=`<div class="card"><p class="small">${season[c]}</p><h2>${name}さんは今、${c}の季節です</h2><div class="text">`;if(m){html+=`<p>${m.current}</p><p>${m.emotion}</p><p>${m.relationship}</p><p>${m.warning}</p><p>${m.future}</p><div class="quote">${m.quote||'努力とは、自分が決めるものではなく、他人が決めるものである。'}</div>`}else{html+=`<p>${summary[c]}</p><div class="quote">努力とは、自分が評価するものではない。<br>他人が努力していると評価するものである。</div>`}html+=`</div></div>`;if(pbirth){const pidx=idx(pbirth);const pc=todayCycle(pidx);const bs=baseScore(bidx,pidx);const ts=score(c,pc);html+=`<div class="card"><p class="small">COMPATIBILITY</p><h2>${pname}さんとの相性</h2><div class="score-wrap"><div class="score"><p class="score-title">基本相性</p><div class="score-num">${bs}点</div><p class="comment">${compatComment(bs)}</p></div><div class="score"><p class="score-title">今日の相性</p><div class="score-num">${ts}点</div><p class="comment">今日の流れに基づく相性です。</p></div></div><div class="text"><p>価値観や考え方に違いがあっても、自然と相手を理解しようとする力があります。</p><p>一緒に時間を重ねるほど、安心感と信頼が深まっていく関係です。</p><p>無理に答えを急がず、自然な距離感を大切にすることで、より良い関係へ繋がっていくでしょう。</p></div><div class="quote">努力とは、自分が評価するものではない。<br>他人が努力していると評価するものである。</div></div>`}document.getElementById('result').innerHTML=html;document.getElementById('result').scrollIntoView({behavior:'smooth'})}
</script>
</body>
</html>
